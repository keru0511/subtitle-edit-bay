name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # pushは差分ごとに独立して検証し、実行中・待機中の先行CIを取り消さない。
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-validation:
    name: Classify validation ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      impact_plan: ${{ steps.impact.outputs.impact_plan }}
      python-quality: ${{ steps.impact.outputs.python-quality }}
      windows-tests: ${{ steps.impact.outputs.windows-tests }}
      windows-launcher-tests: ${{ steps.impact.outputs.windows-launcher-tests }}
      ffmpeg6-compat: ${{ steps.impact.outputs.ffmpeg6-compat }}
      portable-tests: ${{ steps.impact.outputs.portable-tests }}
      windows-installer-smoke: ${{ steps.impact.outputs.windows-installer-smoke }}
      requires_preparation: ${{ steps.classify.outputs.requires_preparation }}
      delegates_to_readiness: ${{ steps.classify.outputs.delegates_to_readiness }}
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan validation by changed paths
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/ci_impact.py
          --base-sha "$BASE_SHA"
          --source-sha "${{ github.sha }}"
          --event-name "${{ github.event_name }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Select the single validation owner
        if: github.event_name == 'pull_request'
        id: classify
        shell: bash
        run: >-
          python scripts/release_readiness.py classify
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --source-sha "${{ github.sha }}"
          --event-name "${{ github.event_name }}"
          --base-ref "${{ github.event.pull_request.base.ref }}"
          --github-output "$GITHUB_OUTPUT"

  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Validate CI test classification
        run: python scripts/run_ci_tests.py --validate

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: python scripts/check_quality.py --lint-only

      - name: Run scoped Ruff format check
        run: python scripts/check_quality.py --format-only --paths scripts/check_quality.py

      - name: Run configured type checks
        run: |
          for platform in linux win32 darwin; do
            python scripts/check_quality.py --type-only --type-platform "$platform"
          done

  portable-tests:
    name: Portable, Qt, and FFmpeg tests
    needs: classify-validation
    if: >-
      !cancelled() &&
      needs.classify-validation.result == 'success' &&
      needs.classify-validation.outputs.portable-tests == 'true' &&
      (github.event_name != 'pull_request' ||
      needs.classify-validation.outputs.delegates_to_readiness != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libegl1 \
            libpulse0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check standard unittest discovery
        run: python scripts/check_unittest_discovery.py

      - name: Run portable unit tests
        run: python scripts/run_ci_tests.py --group portable-unit

      - name: Run Qt and GUI tests
        run: python scripts/run_ci_tests.py --group qt-gui

      - name: Run FFmpeg runtime tests
        env:
          RUN_FFMPEG_SMOKE: "1"
        run: python scripts/run_ci_tests.py --group ffmpeg-runtime

  windows-tests:
    name: Windows runtime tests
    needs: classify-validation
    if: needs.classify-validation.outputs.windows-tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUN_FFMPEG_SMOKE: "1"
      RUN_QT_MEDIA_SMOKE: "1"
      RUN_GUI_AUDIO_MIXER_SMOKE: "1"
      # Hosted runners have no usable GPU. Keep the Qt media smoke on its
      # deterministic software-decoding path instead of probing DXVA2 first.
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Windows FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install system runtime dependencies
        shell: pwsh
        run: |
          $cachedFfmpeg = Get-ChildItem `
              -LiteralPath "C:\ProgramData\chocolatey\lib\ffmpeg\tools" `
              -Filter "ffmpeg.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($cachedFfmpeg) {
              $ffmpegDirectory = $cachedFfmpeg.Directory.FullName
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDirectory -Encoding UTF8
              $env:PATH = "$ffmpegDirectory;$env:PATH"
              Write-Host "Using cached FFmpeg from $ffmpegDirectory"
          }
          $installed = [bool](
              (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
              (Get-Command ffprobe -ErrorAction SilentlyContinue)
          )
          if (-not $installed) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  choco install ffmpeg --version=9.0.1 --yes --no-progress
                  if (
                      (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
                      (Get-Command ffprobe -ErrorAction SilentlyContinue)
                  ) {
                      $installed = $true
                      break
                  }
                  if ($attempt -lt 3) {
                      Start-Sleep -Seconds (10 * $attempt)
                  }
              }
          }
          if (-not $installed) {
              throw "FFmpeg installation failed after 3 attempts."
          }
          ffmpeg -version
          ffprobe -version

      - name: Save Windows FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Import Windows-critical modules
        shell: pwsh
        run: |
          python -c "from src.runtime_dependencies import check_runtime_dependencies; print(check_runtime_dependencies().to_dict())"
          python -c "import src.gui_state; import src.gui_state_base; import src.subtitle_project; import src.subtitle_packer"

      - name: Start GUI on Windows
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path

          from PySide6.QtCore import QTimer, QUrl
          from PySide6.QtQml import QQmlApplicationEngine

          from src.gui import APP_TITLE, EditBayBackend

          app = EditBayBackend(["subtitle-edit-bay-gui-smoke"])
          app.setApplicationName(APP_TITLE)

          engine = QQmlApplicationEngine()
          engine.rootContext().setContextProperty("backend", app)
          qml_path = Path("src/ui/Main.qml").resolve()
          engine.load(QUrl.fromLocalFile(str(qml_path)))
          if not engine.rootObjects():
              raise SystemExit(f"Could not load GUI: {qml_path}")

          QTimer.singleShot(500, app.quit)
          exit_code = app.exec()
          if exit_code != 0:
              raise SystemExit(exit_code)
          '@ | python -

      - name: Run Windows runtime tests
        shell: pwsh
        run: python scripts/run_ci_tests.py --group windows-runtime

      - name: Run Windows GUI regression tests
        shell: pwsh
        run: >-
          python -m unittest -v
          tests.test_gui_editor.GuiEditorRegressionTests.test_ai_proposals_are_locked_during_processing_and_recover
          tests.test_gui_editor.GuiEditorRegressionTests.test_audio_editing_is_locked_during_processing_and_recovers
          tests.test_gui_editor.GuiEditorRegressionTests.test_audio_mixer_gui_settings_are_saved_and_applied_to_rendered_output
          tests.test_gui_editor.GuiEditorRegressionTests.test_workspace_audio_actions_save_reset_and_rebuild_preview
          tests.test_gui_editor.GuiEditorRegressionTests.test_workspace_audio_use_volume_and_solo_controls_are_saved
          tests.test_gui_editor.GuiEditorRegressionTests.test_workspace_subtitle_time_speaker_font_and_size_are_saved
          tests.test_gui_editor.GuiEditorRegressionTests.test_mixer_preview_rebuild_and_transport_controls_use_rebuilt_audio
          tests.test_gui_editor.GuiEditorRegressionTests.test_mixer_fader_drag_reaches_target_and_saves
          tests.test_gui_editor.GuiEditorRegressionTests.test_mixer_reset_button_restores_and_saves_defaults_after_edit
          tests.test_gui_editor.GuiEditorRegressionTests.test_autosave_waits_until_processing_finishes
          tests.test_gui_editor.GuiEditorRegressionTests.test_closing_dictionary_window_saves_pending_input
          tests.test_gui_editor.GuiEditorRegressionTests.test_codex_auth_controls_fit_and_dispatch_from_screen
          tests.test_gui_editor.GuiEditorRegressionTests.test_codex_login_route_dispatches_login_reconnect_and_browser
          tests.test_gui_editor.GuiEditorRegressionTests.test_codex_model_and_new_chat_controls_preserve_project
          tests.test_gui_editor.GuiEditorRegressionTests.test_cut_editing_is_locked_during_processing_and_recovers
          tests.test_gui_editor.GuiEditorRegressionTests.test_cut_restore_and_clear_buttons_update_history_and_saved_project
          tests.test_gui_editor.GuiEditorRegressionTests.test_dictionary_confirmation_switch_saves_and_reopens_from_screen
          tests.test_gui_editor.GuiEditorRegressionTests.test_dictionary_detail_fields_save_pending_input_and_reload
          tests.test_gui_editor.GuiEditorRegressionTests.test_dictionary_save_failure_keeps_window_open_for_retry
          tests.test_gui_editor.GuiEditorRegressionTests.test_dictionary_shortcuts_preserve_pending_input_during_processing
          tests.test_gui_editor.GuiEditorRegressionTests.test_empty_short_mode_gui_adds_range_clip_and_enables_export
