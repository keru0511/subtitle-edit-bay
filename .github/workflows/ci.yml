name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  classify-validation:
    name: Classify validation ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      requires_preparation: ${{ steps.classify.outputs.requires_preparation }}
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the single validation owner
        id: classify
        shell: bash
        run: >-
          python scripts/release_readiness.py classify
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --source-sha "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Validate CI test classification
        run: python scripts/run_ci_tests.py --validate

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: python scripts/check_quality.py --lint-only

      - name: Run scoped Ruff format check
        run: python scripts/check_quality.py --format-only --paths scripts/check_quality.py

      - name: Run scoped mypy type check
        run: python scripts/check_quality.py --type-only --paths scripts/check_quality.py

  portable-tests:
    name: Portable, Qt, and FFmpeg tests
    needs: classify-validation
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.classify-validation.outputs.requires_preparation == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libegl1 \
            libpulse0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check standard unittest discovery
        run: python scripts/check_unittest_discovery.py

      - name: Run portable unit tests
        run: python scripts/run_ci_tests.py --group portable-unit

      - name: Run Qt and GUI tests
        run: python scripts/run_ci_tests.py --group qt-gui

      - name: Run FFmpeg runtime tests
        env:
          RUN_FFMPEG_SMOKE: "1"
        run: python scripts/run_ci_tests.py --group ffmpeg-runtime

  windows-tests:
    name: Windows runtime tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUN_FFMPEG_SMOKE: "1"
      RUN_QT_MEDIA_SMOKE: "1"
      RUN_GUI_AUDIO_MIXER_SMOKE: "1"
      # Hosted runners have no usable GPU. Keep the Qt media smoke on its
      # deterministic software-decoding path instead of probing DXVA2 first.
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Windows FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install system runtime dependencies
        shell: pwsh
        run: |
          $cachedFfmpeg = Get-ChildItem `
              -LiteralPath "C:\ProgramData\chocolatey\lib\ffmpeg\tools" `
              -Filter "ffmpeg.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($cachedFfmpeg) {
              $ffmpegDirectory = $cachedFfmpeg.Directory.FullName
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDirectory -Encoding UTF8
              $env:PATH = "$ffmpegDirectory;$env:PATH"
              Write-Host "Using cached FFmpeg from $ffmpegDirectory"
          }
          $installed = [bool](
              (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
              (Get-Command ffprobe -ErrorAction SilentlyContinue)
          )
          if (-not $installed) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  choco install ffmpeg --version=9.0.1 --yes --no-progress
                  if (
                      (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
                      (Get-Command ffprobe -ErrorAction SilentlyContinue)
                  ) {
                      $installed = $true
                      break
                  }
                  if ($attempt -lt 3) {
                      Start-Sleep -Seconds (10 * $attempt)
                  }
              }
          }
          if (-not $installed) {
              throw "FFmpeg installation failed after 3 attempts."
          }
          ffmpeg -version
          ffprobe -version

      - name: Save Windows FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Import Windows-critical modules
        shell: pwsh
        run: |
          python -c "from src.runtime_dependencies import check_runtime_dependencies; print(check_runtime_dependencies().to_dict())"
          python -c "import src.gui_state; import src.gui_state_base; import src.subtitle_project; import src.subtitle_packer"

      - name: Start GUI on Windows
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path

          from PySide6.QtCore import QTimer, QUrl
          from PySide6.QtQml import QQmlApplicationEngine

          from src.gui import APP_TITLE, EditBayBackend

          app = EditBayBackend(["subtitle-edit-bay-gui-smoke"])
          app.setApplicationName(APP_TITLE)

          engine = QQmlApplicationEngine()
          engine.rootContext().setContextProperty("backend", app)
          qml_path = Path("src/ui/Main.qml").resolve()
          engine.load(QUrl.fromLocalFile(str(qml_path)))
          if not engine.rootObjects():
              raise SystemExit(f"Could not load GUI: {qml_path}")

          QTimer.singleShot(500, app.quit)
          exit_code = app.exec()
          if exit_code != 0:
              raise SystemExit(exit_code)
          '@ | python -

      - name: Run Windows runtime tests
        shell: pwsh
        run: python scripts/run_ci_tests.py --group windows-runtime

      - name: Run Windows FFmpeg and Qt media tests
        shell: pwsh
        run: python scripts/run_ci_tests.py --group windows-ffmpeg-runtime

  windows-launcher-tests:
    name: Windows launcher tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run Windows launcher tests
        shell: pwsh
        run: python scripts/run_ci_tests.py --group windows-launcher-runtime

  ffmpeg6-compat:
    name: FFmpeg 6 compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      RUN_FFMPEG6_COMPAT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install compatibility test dependencies
        shell: pwsh
        run: python -m pip install "numpy>=1.26,<3"

      - name: Install FFmpeg 6.1.1
        shell: pwsh
        run: |
          $installed = $false
          $version = ""
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --version=6.1.1 --yes --no-progress --allow-downgrade --force
              if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
                  $version = (& ffmpeg -version | Select-Object -First 1)
                  if ($version -match '^ffmpeg version 6\.') {
                      $installed = $true
                      break
                  }
              }
              if ($attempt -lt 3) {
                  Start-Sleep -Seconds (10 * $attempt)
              }
          }
          if (-not $installed) {
              throw "FFmpeg 6.1.1 installation failed after 3 attempts. Last version: $version"
          }
          ffmpeg -version
          ffprobe -version

      - name: Run FFmpeg 6 compatibility tests
        shell: pwsh
        run: python scripts/run_ci_tests.py --group ffmpeg6-compat

  windows-installer-smoke:
    name: Windows installer smoke
    needs: classify-validation
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.classify-validation.outputs.requires_preparation == 'false')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $compiler) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                  throw "Inno Setup installation failed with exit code $LASTEXITCODE."
              }
          }

      - name: Build and verify installer package
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "subtitle-edit-bay-release"
          ./scripts/build_release_package.ps1 `
              -ReleaseVersion $releaseVersion `
              -SourceSha $env:GITHUB_SHA `
              -OutputDirectory $releaseDirectory
          python scripts/release_contract.py verify-artifacts `
              --directory $releaseDirectory `
              --expected-version $releaseVersion `
              --expected-source-sha $env:GITHUB_SHA

      - name: Install and start built application
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          ./scripts/test_installer.ps1 `
              -InstallerPath (Join-Path $env:RUNNER_TEMP "subtitle-edit-bay-release\SubtitleEditBay-Setup.exe") `
              -ExpectedVersion $releaseVersion `
              -InstallDirectory (Join-Path $env:RUNNER_TEMP "SubtitleEditBayInstalled")

  validation-result:
    name: CI validation result
    if: always() && github.event_name == 'pull_request'
    needs:
      - classify-validation
      - python-quality
      - portable-tests
      - windows-tests
      - windows-launcher-tests
      - ffmpeg6-compat
      - windows-installer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out validated merge candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce validation ownership and results
        run: >-
          python scripts/release_readiness.py assert-ci-validation
          --requires-preparation "${{ needs.classify-validation.outputs.requires_preparation }}"
          --classify-result "${{ needs.classify-validation.result }}"
          --required-result "${{ needs.python-quality.result }}"
          --required-result "${{ needs.windows-tests.result }}"
          --required-result "${{ needs.windows-launcher-tests.result }}"
          --required-result "${{ needs.ffmpeg6-compat.result }}"
          --delegated-result "${{ needs.portable-tests.result }}"
          --delegated-result "${{ needs.windows-installer-smoke.result }}"
      - name: Record validated source identity
        shell: bash
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          VALIDATION_PROFILE: ${{ needs.classify-validation.outputs.requires_preparation == 'true' && 'release-candidate-v1' || 'standard-v1' }}
          DELEGATED_WORKFLOW: ${{ needs.classify-validation.outputs.requires_preparation == 'true' && '.github/workflows/release-readiness.yml' || 'none' }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "CI checkout does not match GITHUB_SHA." >&2; exit 1; }
          python scripts/release_candidate.py write-ci-validation \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PULL_REQUEST_NUMBER" \
            --pull-request-head-sha "$PULL_REQUEST_HEAD_SHA" \
            --pull-request-base-sha "$PULL_REQUEST_BASE_SHA" \
            --pull-request-head-branch "$PULL_REQUEST_HEAD_BRANCH" \
            --source-sha "$source_sha" \
            --source-tree "$source_tree" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --validation-profile "$VALIDATION_PROFILE" \
            --delegated-workflow "$DELEGATED_WORKFLOW" \
            --output ci-validation-identity.json
      - name: Upload immutable CI validation identity
        uses: actions/upload-artifact@v6
        with:
          name: ci-validation-identity-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ci-validation-identity.json
          if-no-files-found: error
          retention-days: 14
