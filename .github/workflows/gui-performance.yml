name: GUI performance

on:
  pull_request:
    paths:
      - ".github/workflows/gui-performance.yml"
      - "docs/GUI_PERFORMANCE.md"
      - "requirements.txt"
      - "scripts/aggregate_gui_performance.py"
      - "scripts/compare_gui_performance.py"
      - "scripts/generate_large_gui_fixture.py"
      - "scripts/gui_performance_report.py"
      - "scripts/plan_gui_performance.py"
      - "scripts/run_gui_performance.py"
      - "src/gui.py"
      - "src/ui/**"
      - "tests/gui_performance_scenarios.py"
      - "tests/gui_test_harness.py"
      - "tests/test_gui_editor.py"
      - "tests/test_gui_large_project_performance.py"
      - "tests/test_gui_performance_pipeline.py"
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions per fixture"
        required: true
        default: "3"
      playback_seconds:
        description: "Continuous playback duration"
        required: true
        default: "30"
      compare_ref:
        description: "Reference revision (pre-#302 by default)"
        required: true
        default: "b600e90"
      max_regression_percent:
        description: "Allowed regression against the reference"
        required: true
        default: "20"
      fail_on_regression:
        description: "Fail when timing budgets are exceeded"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gui-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate inputs and plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repetitions: ${{ steps.plan.outputs.repetitions }}
      playback_seconds: ${{ steps.plan.outputs.playback_seconds }}
      compare_ref: ${{ steps.plan.outputs.compare_ref }}
      max_regression: ${{ steps.plan.outputs.max_regression }}
      fail_on_regression: ${{ steps.plan.outputs.fail_on_regression }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs and create repetition matrix
        id: plan
        env:
          INPUT_REPETITIONS: ${{ inputs.repetitions || '3' }}
          INPUT_PLAYBACK_SECONDS: ${{ inputs.playback_seconds || '30' }}
          INPUT_COMPARE_REF: ${{ inputs.compare_ref || 'b600e90' }}
          INPUT_MAX_REGRESSION: ${{ inputs.max_regression_percent || '20' }}
          INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression || 'false' }}
        run: |
          python scripts/plan_gui_performance.py \
            --repetitions "$INPUT_REPETITIONS" \
            --playback-seconds "$INPUT_PLAYBACK_SECONDS" \
            --compare-ref "$INPUT_COMPARE_REF" \
            --max-regression-percent "$INPUT_MAX_REGRESSION" \
            --fail-on-regression "$INPUT_FAIL_ON_REGRESSION" \
            --github-output "$GITHUB_OUTPUT"

  benchmark:
    name: Windows benchmark (repetition ${{ matrix.repetition }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Windows FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $cachedFfmpeg = Get-ChildItem `
              -LiteralPath "C:\ProgramData\chocolatey\lib\ffmpeg\tools" `
              -Filter "ffmpeg.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($cachedFfmpeg) {
              $ffmpegDirectory = $cachedFfmpeg.Directory.FullName
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDirectory -Encoding UTF8
              $env:PATH = "$ffmpegDirectory;$env:PATH"
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              choco install ffmpeg --version=9.0.1 --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                  throw "FFmpeg installation failed with exit code $LASTEXITCODE."
              }
          }
          ffmpeg -version

      - name: Save Windows FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\ProgramData\chocolatey\lib\ffmpeg
          key: windows-ffmpeg-9.0.1-v1

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run current 3,000 and 10,000 subtitle scenarios
        shell: pwsh
        env:
          BENCHMARK_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
          BENCHMARK_PLAYBACK_SECONDS: ${{ needs.prepare.outputs.playback_seconds }}
          BENCHMARK_CURRENT_SHA: ${{ github.sha }}
          BENCHMARK_REPETITION: ${{ matrix.repetition }}
        run: |
          python scripts/run_gui_performance.py `
            --segment-count 3000 `
            --segment-count 10000 `
            --repetitions 1 `
            --repetition-index $env:BENCHMARK_REPETITION `
            --total-repetitions $env:BENCHMARK_REPETITIONS `
            --playback-seconds $env:BENCHMARK_PLAYBACK_SECONDS `
            --revision-label $env:BENCHMARK_CURRENT_SHA `
            --harness-revision $env:BENCHMARK_CURRENT_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard-id $env:BENCHMARK_REPETITION `
            --output "artifacts/gui-performance-current-$env:BENCHMARK_REPETITION.json" `
            --fixture-dir "$env:RUNNER_TEMP/gui-performance-current"

      - name: Run reference 3,000 subtitle scenario with the same harness
        if: always()
        shell: pwsh
        env:
          BENCHMARK_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
          BENCHMARK_PLAYBACK_SECONDS: ${{ needs.prepare.outputs.playback_seconds }}
          BENCHMARK_COMPARE_SHA: ${{ needs.prepare.outputs.compare_ref }}
          BENCHMARK_CURRENT_SHA: ${{ github.sha }}
          BENCHMARK_REPETITION: ${{ matrix.repetition }}
        run: |
          $referenceRoot = Join-Path $env:RUNNER_TEMP "gui-performance-reference"
          git worktree add --detach $referenceRoot $env:BENCHMARK_COMPARE_SHA
          New-Item -ItemType Directory -Force -Path "$referenceRoot/scripts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$referenceRoot/tests" | Out-Null
          Copy-Item scripts/generate_large_gui_fixture.py "$referenceRoot/scripts/generate_large_gui_fixture.py"
          Copy-Item scripts/gui_performance_report.py "$referenceRoot/scripts/gui_performance_report.py"
          Copy-Item scripts/run_gui_performance.py "$referenceRoot/scripts/run_gui_performance.py"
          Copy-Item tests/gui_performance_scenarios.py "$referenceRoot/tests/gui_performance_scenarios.py"
          Copy-Item tests/gui_test_harness.py "$referenceRoot/tests/gui_test_harness.py"
          Push-Location $referenceRoot
          try {
              python scripts/run_gui_performance.py `
                --segment-count 3000 `
                --repetitions 1 `
                --repetition-index $env:BENCHMARK_REPETITION `
                --total-repetitions $env:BENCHMARK_REPETITIONS `
                --playback-seconds $env:BENCHMARK_PLAYBACK_SECONDS `
                --revision-label $env:BENCHMARK_COMPARE_SHA `
                --harness-revision $env:BENCHMARK_CURRENT_SHA `
                --run-id $env:GITHUB_RUN_ID `
                --run-attempt $env:GITHUB_RUN_ATTEMPT `
                --shard-id $env:BENCHMARK_REPETITION `
                --no-enforce-contracts `
                --output "$env:GITHUB_WORKSPACE/artifacts/gui-performance-reference-$env:BENCHMARK_REPETITION.json" `
                --fixture-dir "$env:RUNNER_TEMP/gui-performance-reference-fixtures"
          } finally {
              Pop-Location
          }

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-performance-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.repetition }}
          path: artifacts/gui-performance-*.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Integrated benchmark gate
    needs:
      - prepare
      - benchmark
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download this attempt's shard reports
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: gui-performance-shard-${{ github.run_id }}-*
          path: artifacts/shards

      - name: Validate, aggregate, and compare all raw results
        if: always()
        env:
          BENCHMARK_JOB_RESULT: ${{ needs.benchmark.result }}
          BENCHMARK_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
          BENCHMARK_PLAYBACK_SECONDS: ${{ needs.prepare.outputs.playback_seconds }}
          BENCHMARK_COMPARE_SHA: ${{ needs.prepare.outputs.compare_ref }}
          BENCHMARK_MAX_REGRESSION: ${{ needs.prepare.outputs.max_regression }}
          BENCHMARK_FAIL_ON_REGRESSION: ${{ needs.prepare.outputs.fail_on_regression }}
        run: |
          set +e
          python scripts/aggregate_gui_performance.py \
            --input-dir artifacts/shards \
            --output-dir artifacts/combined \
            --repetitions "$BENCHMARK_REPETITIONS" \
            --playback-seconds "$BENCHMARK_PLAYBACK_SECONDS" \
            --current-revision "${{ github.sha }}" \
            --baseline-revision "$BENCHMARK_COMPARE_SHA" \
            --harness-revision "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"
          aggregate_status=$?

          comparison_status=0
          if [[ $aggregate_status -eq 0 ]]; then
            comparison_args=(
              scripts/compare_gui_performance.py
              --current artifacts/combined/gui-performance-current.json
              --baseline artifacts/combined/gui-performance-reference.json
              --output artifacts/combined/gui-performance-comparison.json
              --max-regression-percent "$BENCHMARK_MAX_REGRESSION"
            )
            if [[ "$BENCHMARK_FAIL_ON_REGRESSION" == "true" ]]; then
              comparison_args+=(--fail-on-regression)
            fi
            python "${comparison_args[@]}"
            comparison_status=$?
          fi

          if [[ "$BENCHMARK_JOB_RESULT" != "success" ]]; then
            echo "Benchmark matrix result was $BENCHMARK_JOB_RESULT; the integrated gate cannot pass."
            exit 1
          fi
          if [[ $aggregate_status -ne 0 || $comparison_status -ne 0 ]]; then
            exit 1
          fi

      - name: Upload integrated reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-performance-integrated-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/combined/gui-performance-*.json
          if-no-files-found: error
          retention-days: 30
