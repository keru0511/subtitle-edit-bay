name: Release from merged version

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full SHA of a VERSION-only commit already on main"
        required: true
        type: string
      release_version:
        description: "Version matching that commit (for example, v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-request-${{ inputs.release_version || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate approved release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Check out main history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable publication target
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE_SHA: ${{ github.event.before || '' }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          REQUESTED_VERSION: ${{ inputs.release_version || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source_sha="$REQUESTED_SOURCE_SHA"
            release_version="$REQUESTED_VERSION"
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "A full source SHA is required." >&2; exit 1; }
            git cat-file -e "$source_sha^{commit}"
            git merge-base --is-ancestor "$source_sha" origin/main || {
              echo "Manual release source must already be on main." >&2
              exit 1
            }
            base_sha="$(git rev-parse "$source_sha^1")"
          else
            source_sha="$EVENT_SOURCE_SHA"
            base_sha="$EVENT_BEFORE_SHA"
          fi
          output_file="$(mktemp)"
          python scripts/release_readiness.py classify \
            --base-sha "$base_sha" \
            --source-sha "$source_sha" \
            --github-output "$output_file"
          kind="$(sed -n 's/^kind=//p' "$output_file")"
          [[ "$kind" == "release" ]] || { echo "Publication target is not a VERSION-only release commit." >&2; exit 1; }
          classified_version="$(sed -n 's/^release_version=//p' "$output_file")"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$release_version" != "$classified_version" ]]; then
            echo "Requested release_version does not match the source VERSION." >&2
            exit 1
          fi
          release_version="$classified_version"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  release:
    name: Promote candidate for exact merge
    needs: validate
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      contents: write
      pull-requests: read
    with:
      release_commit_sha: ${{ needs.validate.outputs.source_sha }}
      release_version: ${{ needs.validate.outputs.release_version }}
