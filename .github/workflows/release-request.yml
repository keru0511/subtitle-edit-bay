name: Create release tag from merged request

on:
  push:
    branches:
      - main
    paths:
      - "release-requests/v*"

concurrency:
  group: release-request-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    name: Validate request and create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out merged release request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate request, create annotated tag, and start release
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "A release request requires an existing main history." >&2
            exit 1
          fi

          mapfile -t requests < <(
            git diff --diff-filter=A --name-only "$BEFORE_SHA" "$RELEASE_SHA" -- 'release-requests/v*'
          )
          if (( ${#requests[@]} != 1 )); then
            echo "Exactly one new release request is required; found ${#requests[@]}." >&2
            exit 1
          fi

          request_path="${requests[0]}"
          tag="${request_path#release-requests/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release request must be named release-requests/vX.Y.Z: $request_path" >&2
            exit 1
          fi

          request_tag="$(tr -d '\r\n' < "$request_path")"
          source_tag="$(tr -d '\r\n' < VERSION)"
          if [[ "$request_tag" != "$tag" || "$source_tag" != "$tag" ]]; then
            echo "Request, VERSION, and tag must match: request=$request_tag VERSION=$source_tag tag=$tag" >&2
            exit 1
          fi

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$RELEASE_SHA" ]]; then
            echo "Release request must tag the current main HEAD: main=$remote_main request=$RELEASE_SHA" >&2
            exit 1
          fi

          existing_tag="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          existing_target="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [[ -n "$existing_tag" ]]; then
            if [[ -z "$existing_target" || "$existing_target" != "$RELEASE_SHA" ]]; then
              echo "Existing tag is not the expected annotated tag for this release: $tag" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; workflow dispatch is not required: $tag"
            exit 0
          fi

          active_run_count="$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 \
              --json event,headSha,status \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .headSha == \"$RELEASE_SHA\" and (.status == \"queued\" or .status == \"in_progress\"))] | length"
          )"
          if [[ "$active_run_count" != "0" ]]; then
            echo "Release workflow is already active for $tag."
            exit 0
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="$tag"
