name: Release from merged version

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching VERSION (for example, v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-request-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Validate version and create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and create annotated tag
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail

          source_tag="$(tr -d '\r\n' < VERSION)"
          tag="${REQUESTED_TAG:-$source_tag}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be a strict vX.Y.Z tag: $tag" >&2
            exit 1
          fi
          if [[ "$source_tag" != "$tag" ]]; then
            echo "Requested tag and VERSION must match: requested=$tag VERSION=$source_tag" >&2
            exit 1
          fi

          existing_tag="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          existing_target="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [[ -n "$existing_tag" ]]; then
            if [[ -z "$existing_target" || "$existing_target" != "$RELEASE_SHA" ]]; then
              echo "Existing tag is not the expected annotated tag for this release: $tag" >&2
              exit 1
            fi
          else
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_main" != "$RELEASE_SHA" ]]; then
              echo "A new release must use the current main HEAD: main=$remote_main release=$RELEASE_SHA" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
