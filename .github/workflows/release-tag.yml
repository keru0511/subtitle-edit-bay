name: Release pushed tag

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build and publish release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
