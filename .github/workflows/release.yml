name: Release Windows installer

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact approved commit to publish"
        required: true
        type: string
      release_version:
        description: "Strict vX.Y.Z version to publish"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_version }}-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Revalidate and prepare approved source
    uses: ./.github/workflows/release-prepare.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      release_version: ${{ inputs.release_version }}

  tag:
    name: Create immutable release tag
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Create or verify annotated tag
        id: tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          existing_tag="$(git ls-remote origin "refs/tags/$RELEASE_VERSION" | awk '{print $1}')"
          existing_target="$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | awk '{print $1}')"
          if [[ -n "$existing_tag" ]]; then
            [[ -n "$existing_target" ]] || { echo "Existing release tag is not annotated." >&2; exit 1; }
            [[ "$existing_target" == "$SOURCE_SHA" ]] || {
              echo "Existing tag points to a different commit: $existing_target" >&2
              exit 1
            }
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" "$SOURCE_SHA" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-tools
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Download prepared installer
        id: download
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: dist
      - name: Verify prepared installer again
        id: verify
        shell: bash
        run: >-
          python release-tools/scripts/release_contract.py verify-artifacts
          --directory dist
          --expected-version "${{ inputs.release_version }}"
          --expected-source-sha "${{ inputs.source_sha }}"
      - name: Create release or verify an identical existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          assets=(
            "dist/SubtitleEditBay-Setup.exe"
            "dist/SubtitleEditBay-Setup.exe.sha256"
            "dist/SubtitleEditBay-Setup.exe.manifest.json"
            "dist/release-preparation.json"
          )
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir existing-release
            python release-tools/scripts/release_contract.py verify-artifacts \
              --directory existing-release \
              --expected-version "${RELEASE_VERSION#v}" \
              --expected-source-sha "$SOURCE_SHA"
            cmp dist/SubtitleEditBay-Setup.exe.sha256 existing-release/SubtitleEditBay-Setup.exe.sha256
            echo "An identical release already exists; no assets were overwritten."
            exit 0
          fi
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Subtitle Edit Bay ${RELEASE_VERSION#v}" \
            --generate-notes
