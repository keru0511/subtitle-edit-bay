name: Promote verified Windows installer

on:
  workflow_call:
    inputs:
      release_commit_sha:
        description: "Exact approved merge commit to tag"
        required: true
        type: string
      release_version:
        description: "Strict vX.Y.Z version to publish"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_version }}-${{ inputs.release_commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Select and verify approved candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      candidate_source_sha: ${{ steps.select.outputs.candidate_source_sha }}
      workflow_run_id: ${{ steps.select.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.select.outputs.workflow_run_attempt }}
      pull_request_number: ${{ steps.select.outputs.pull_request_number }}
      installer_sha256: ${{ steps.verify.outputs.installer_sha256 }}
      promotion_artifact_name: ${{ steps.context.outputs.name }}
    steps:
      - name: Check out trusted publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-tools
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Select the final matching readiness artifact
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release-tools/scripts/release_candidate.py select
          --repository "$GITHUB_REPOSITORY"
          --release-commit-sha "${{ inputs.release_commit_sha }}"
          --release-version "${{ inputs.release_version }}"
          --output selected-candidate.json
          --github-output "$GITHUB_OUTPUT"
      - name: Download the selected artifact by immutable identity
        id: download
        uses: actions/download-artifact@v7
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.workflow_run_id }}
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify candidate bytes and provenance
        id: verify
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.select.outputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          python release-tools/scripts/release_contract.py verify-artifacts \
            --directory dist \
            --expected-version "${{ inputs.release_version }}" \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA"
          installer_sha256="$(sha256sum dist/SubtitleEditBay-Setup.exe | awk '{print $1}')"
          echo "installer_sha256=$installer_sha256" >> "$GITHUB_OUTPUT"
          python release-tools/scripts/release_candidate.py write-promotion \
            --candidate selected-candidate.json \
            --installer-sha256 "$installer_sha256" \
            --output release-promotion.json
      - name: Preserve immutable promotion decision
        id: context
        shell: bash
        run: echo "name=release-promotion-${{ inputs.release_commit_sha }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Upload promotion record
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.context.outputs.name }}
          path: |
            selected-candidate.json
            release-promotion.json
          if-no-files-found: error
          retention-days: 14

  tag:
    name: Create immutable release tag
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_commit_sha }}
          fetch-depth: 0
      - name: Create or verify annotated tag
        id: tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
        run: |
          set -euo pipefail
          existing_tag="$(git ls-remote origin "refs/tags/$RELEASE_VERSION" | awk '{print $1}')"
          existing_target="$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | awk '{print $1}')"
          if [[ -n "$existing_tag" ]]; then
            [[ -n "$existing_target" ]] || { echo "Existing release tag is not annotated." >&2; exit 1; }
            [[ "$existing_target" == "$RELEASE_COMMIT_SHA" ]] || {
              echo "Existing tag points to a different commit: $existing_target" >&2
              exit 1
            }
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

  publish:
    name: Publish GitHub Release
    needs:
      - candidate
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-tools
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Download selected candidate bytes
        id: download
        uses: actions/download-artifact@v7
        with:
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.workflow_run_id }}
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Download frozen promotion decision
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.promotion_artifact_name }}
          path: promotion
      - name: Verify selected installer again
        id: verify
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.candidate.outputs.candidate_source_sha }}
          INSTALLER_SHA256: ${{ needs.candidate.outputs.installer_sha256 }}
        run: |
          set -euo pipefail
          python release-tools/scripts/release_contract.py verify-artifacts \
            --directory dist \
            --expected-version "${{ inputs.release_version }}" \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA"
          actual_sha256="$(sha256sum dist/SubtitleEditBay-Setup.exe | awk '{print $1}')"
          [[ "$actual_sha256" == "$INSTALLER_SHA256" ]] || { echo "Installer changed after candidate verification." >&2; exit 1; }
          python release-tools/scripts/release_candidate.py write-promotion \
            --candidate promotion/selected-candidate.json \
            --installer-sha256 "$actual_sha256" \
            --output expected-release-promotion.json
          python release-tools/scripts/release_candidate.py verify-promotion \
            --actual promotion/release-promotion.json \
            --expected expected-release-promotion.json
          cp promotion/release-promotion.json dist/release-promotion.json
      - name: Inspect existing GitHub Release
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release-tools/scripts/release_state.py inspect-release
          --repository "$GITHUB_REPOSITORY"
          --release-version "${{ inputs.release_version }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Create, publish, or verify an identical existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          assets=(
            "SubtitleEditBay-Setup.exe"
            "SubtitleEditBay-Setup.exe.sha256"
            "SubtitleEditBay-Setup.exe.manifest.json"
            "release-preparation.json"
            "release-promotion.json"
          )
          asset_paths=()
          for asset in "${assets[@]}"; do asset_paths+=("dist/$asset"); done
          if [[ "${{ steps.state.outputs.action }}" == "create" ]]; then
            gh release create "$RELEASE_VERSION" "${asset_paths[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Subtitle Edit Bay ${RELEASE_VERSION#v}" \
              --generate-notes
          else
            mkdir existing-release
            gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > existing-assets.txt
            mapfile -t existing_asset_names < existing-assets.txt
            for existing_asset in "${existing_asset_names[@]}"; do
              expected=false
              for asset in "${assets[@]}"; do
                if [[ "$existing_asset" == "$asset" ]]; then expected=true; break; fi
              done
              [[ "$expected" == true ]] || { echo "Release has unexpected asset: $existing_asset" >&2; exit 1; }
            done
            if [[ "${#existing_asset_names[@]}" -gt 0 ]]; then
              gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir existing-release
            fi
            missing=()
            for asset in "${assets[@]}"; do
              if [[ -f "existing-release/$asset" ]]; then
                cmp "dist/$asset" "existing-release/$asset"
              else
                missing+=("dist/$asset")
              fi
            done
            if [[ "${{ steps.state.outputs.action }}" == "reuse" ]]; then
              [[ "${#missing[@]}" -eq 0 ]] || { echo "Published release is missing required assets." >&2; exit 1; }
              echo "An identical published release already exists; no assets were overwritten."
            elif [[ "${{ steps.state.outputs.action }}" == "publish-draft" ]]; then
              if [[ "${#missing[@]}" -gt 0 ]]; then
                gh release upload "$RELEASE_VERSION" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
              fi
              gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
            else
              echo "Unexpected existing release action: ${{ steps.state.outputs.action }}" >&2
              exit 1
            fi
          fi
      - name: Require published GitHub Release
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python release-tools/scripts/release_state.py assert-published
          --repository "$GITHUB_REPOSITORY"
          --release-version "${{ inputs.release_version }}"
