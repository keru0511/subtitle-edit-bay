name: 実音声の文字起こし精度

on:
  pull_request:
    paths:
      - '.github/workflows/transcription-accuracy.yml'
      - 'assets/asr_benchmark/manifest.json'
      - 'assets/asr_benchmark/*.flac'
      - 'assets/asr_benchmark/*.wav'
      - 'assets/runtime_config.json'
      - 'runtime/requirements-windows-cpu.lock'
      - 'runtime/runtime-contract.json'
      - 'scripts/benchmark_transcription.py'
      - 'scripts/asr_ci_runtime.py'
      - 'scripts/runtime_contract.py'
      - 'src/transcribe.py'
      - 'src/transcription_profile.py'
      - 'src/transcription_execution.py'
      - 'src/whisperx_runner.py'
      - 'src/ctc_alignment.py'
      - 'src/craig_transcription_execution.py'
      - 'src/runtime_settings.py'
  workflow_dispatch:
    inputs:
      compare_ref:
        description: '比較対象のコミットまたはブランチ'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: transcription-accuracy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-asr:
    name: 日本語実録音の認識 (${{ matrix.revision }})
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TOKENIZERS_PARALLELISM: 'false'

    steps:
      - name: 変更後のコードを取得
        uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false

      - name: 比較対象のコードを取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.compare_ref }}
          path: baseline
          persist-credentials: false

      - name: Python 3.10を準備
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 実行環境の識別子を取得
        id: cache-context
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $key = python scripts/asr_ci_runtime.py cache-key --venv "$env:GITHUB_WORKSPACE/.asr-venv"
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 導入済みCPUランタイムを復元
        id: runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.asr-venv
          key: ${{ steps.cache-context.outputs.key }}

      - name: FFmpegを準備
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "HF_HOME=$env:RUNNER_TEMP/asr-models" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          choco install ffmpeg --yes --no-progress
          ffmpeg -version

      - name: 固定CPUランタイムを準備・検証
        id: runtime
        env:
          RUNTIME_CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $venv = Join-Path $env:GITHUB_WORKSPACE '.asr-venv'
          python scripts/asr_ci_runtime.py prepare --venv $venv --manifest "$env:RUNNER_TEMP/asr-runtime-manifest.json"
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 実録音を初回認識し誤りと時刻を比較
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/benchmark_transcription.py --baseline-root ../baseline --candidate-root . --revision ${{ matrix.revision }} --output ../asr-report

      - name: 認識結果と比較レポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transcription-accuracy-${{ matrix.revision }}-${{ github.run_id }}
          path: asr-report/
          if-no-files-found: warn
          retention-days: 14

      - name: 検証済みCPUランタイムを保存
        if: always() && steps.runtime.outcome == 'success' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.asr-venv
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

  compare:
    name: 日本語実録音をlarge-v3で比較
    needs: real-asr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: 両版の実認識結果を取得
        uses: actions/download-artifact@v8
        with:
          pattern: transcription-accuracy-*-${{ github.run_id }}
          path: recognition-results
      - name: 実認識の完了と比較条件を検証して判定
        env:
          RECOGNITION_RESULT: ${{ needs.real-asr.result }}
        run: |
          test "$RECOGNITION_RESULT" = success
          python scripts/benchmark_transcription.py --merge-reports recognition-results/transcription-accuracy-baseline-${{ github.run_id }}/report.json recognition-results/transcription-accuracy-candidate-${{ github.run_id }}/report.json --output asr-comparison
      - name: 比較レポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transcription-accuracy-${{ github.run_id }}
          path: asr-comparison/
          if-no-files-found: warn
          retention-days: 14
