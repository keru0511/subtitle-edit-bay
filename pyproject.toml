[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  ".local",
  ".gui",
  "video_import",
  "video_export",
  "out",
  "dist",
  "build",
]

[tool.ruff.lint]
# 構文エラーとPyflakesの全ルールを検証する。
# 互換性のための再公開は同名aliasで明示する。
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# 小さなOS境界から型チェックを段階的に厳格化する。
[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["src.platform_paths", "src.platform_updates", "src.process_utils", "src.qprocess_launcher"]
strict = true
disallow_any_explicit = true

# 品質チェックのジョブではGUI本体を導入しない。
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true
