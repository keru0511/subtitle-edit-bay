  "src/short_video_schema.py",
  "tests/test_video_sequence_models.py",
  "tests/test_short_video_schema.py",
  "tests/test_video_timeline_models.py",
  "tests/test_transcription_context_models.py",
  "tests/test_transcription_context_config.py",
  "tests/test_transcription_dictionary.py",
]
explicit_package_bases = true
# 実際に使用する外部組版APIの型を、依存未導入の品質ジョブでも解決する。
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"

[[tool.mypy.overrides]]
module = ["src.platform_paths", "src.platform_updates", "src.process_utils", "src.qprocess_launcher"]
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
disallow_any_decorated = true

# 品質チェックのジョブではGUI本体を導入しない。
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

# 移行済みのデータ境界・モデルでは明示・暗黙のAnyを禁止する。
