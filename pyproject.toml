[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  ".local",
  ".gui",
  "video_import",
  "video_export",
  "out",
  "dist",
  "build",
]

[tool.ruff.lint]
# 構文エラーとPyflakesの全ルールを検証する。
# 互換性のための再公開は同名aliasで明示する。
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# 小さなOS境界から型チェックを段階的に厳格化する。
[tool.mypy]
python_version = "3.10"
# CIとローカルが同じ対象を使う。全体移行に伴ってこの一覧を拡張する。
files = [
  "scripts/check_quality.py",
  "src/platform_paths.py",
  "src/platform_updates.py",
  "src/process_utils.py",
  "src/qprocess_launcher.py",
  "src/application_logging.py",
  "src/ai_provider.py",
  "src/codex_runtime.py",
  "src/gemini_runtime.py",
  "src/transcript_cache.py",
  "src/gui_workspace_controller.py",
  "tests/test_transcript_cache.py",
  "src/data_boundary.py",
  "src/channel_presets.py",
  "src/runtime_config.py",
  "src/runtime_config_schema.py",
  "tests/test_data_boundary.py",
  "tests/test_channel_presets.py",
  "tests/test_runtime_config.py",
  "src/transcribe.py",
  "src/media_probe.py",
  "src/merge_transcripts.py",
  "src/pipeline.py",
  "src/youtube_text.py",
  "src/youtube_package.py",
  "src/thumbnail_candidates.py",
  "src/codex_highlight_ranker.py",
  "src/highlight_signals.py",
  "src/highlight_candidates.py",
  "src/audio_mix_proposal.py",
  "src/transcription_execution.py",
  "src/craig_transcription_execution.py",
  "tests/test_transcribe.py",
  "tests/test_media_probe.py",
  "tests/test_merge_transcripts.py",
  "tests/test_youtube_text.py",
  "tests/test_youtube_package.py",
  "tests/test_codex_highlight_ranker.py",
  "tests/test_highlight_candidates.py",
  "tests/test_audio_mix_proposal.py",
  "src/transcription_hint_plan.py",
  "src/transcription_hint_workflow.py",
  "tests/test_transcription_hint_plan.py",
  "tests/test_transcription_hint_workflow.py",
  "src/transcription_context.py",
  "src/transcription_context_config.py",
  "src/transcription_dictionary.py",
  "src/transcription_metadata.py",
  "src/video_timeline.py",
  "src/timeline_interchange.py",
  "tests/test_timeline_interchange.py",
  "src/subtitle_project_schema.py",
  "src/subtitle_project_model.py",
  "src/subtitle_project.py",
  "tests/test_subtitle_project_persistence_types.py",
  "src/project_snapshots.py",
  "src/project_recovery.py",
  "src/audio_mixer.py",
  "tests/test_subtitle_packer_contracts.py",
